# Benchmark matrix for THIS branch (3.7). Encodes the four test categories
# as data; matrix.py's resolve_cells() expands them into canonical cells.
# Values are derived from the old 3.7 bash scripts (common.sh, cat1, cat3,
# cat4, cat5). Concurrency-model realization (WS multiplexing: pool x
# maxInProcessPerConnection for java/dotnet, small fixed pool for js, plain
# pool for go/python) is an adapter concern driven by config.yaml's
# concurrency_model: multiplex, and is deliberately not encoded here.

tests:
  # Category 1 (cat1): per-request transport cost. Sequential latency over
  # two query sizes, run for every GLV. Identical to 4.0 (latency does not
  # depend on the concurrency model).
  protocol-overhead:
    metric: latency
    points:
      size:
        tiny: "g.V()"
        medium: "g.V().repeat(both()).times(12)"
    warmups: 2
    executions: 3
    timeout: 600000

  # Category 3 (cat3): Java-only peak throughput, WS multiplexed. The old
  # script pinned pool=128 (min==max==128) with parallelism 16 and 5M
  # requests for steady state. (4.0 used pool=5000; 3.7's multiplexed pool
  # is far smaller because each connection carries up to maxInProcess=64.)
  peak-throughput:
    metric: throughput
    glvs: [java]
    parallelism: 16
    pool: 128
    requests: 5000000
    warmups: 2
    executions: 3

  # Category 4 (cat4): concurrency scaling curve. Request counts are tiered
  # by concurrency, per GLV. The 3.7 java tier differs from the others
  # (java_requests: jumps to 50000 at C<=64 and has no 30000 step), so java
  # gets its own tier here; go/dotnet/js share "default" (fast_glv_requests)
  # and python has its own tier (python_requests).
  #
  # NOTE: the old cat4 java loop swept [4,16,64,256,512,1000,5000] (it
  # skipped 128); all other GLVs swept [4,16,64,128,256,512,1000,5000]. The
  # matrix schema uses a single shared concurrency list, so we use the
  # superset below — java additionally gets a C=128 cell that the old script
  # did not run. (Harmless extra point; the multiplex arithmetic handles it.)
  scaling-curve:
    metric: throughput
    sweep:
      concurrency: [4, 16, 64, 128, 256, 512, 1000, 5000]
    warmups: 2
    executions: 3
    requests_by_concurrency:
      # go / dotnet / javascript (old fast_glv_requests).
      default:
        "<=4": 1000
        "<=16": 5000
        "<=64": 10000
        "<=128": 30000
        "<=1000": 50000
        ">": 500000
      # java (old java_requests).
      java:
        "<=4": 1000
        "<=16": 5000
        "<=64": 50000
        ">": 500000
      # python (old python_requests).
      python:
        "<=4": 500
        "<=16": 1000
        "<=64": 3000
        "<=1000": 5000
        ">": 10000

  # Category 5 (cat5): pool sensitivity. Parallelism fixed high (per GLV),
  # pool swept across four per-GLV points (derived from the old cat5 loops).
  #
  # NOTE: the old cat5 used per-GLV request counts (java 200000, go 50000,
  # dotnet 50000, js 30000, python 3000) and per-GLV warmups (3 everywhere
  # except python's 2). The matrix schema exposes only a single test-level
  # `requests`/`warmups` for this test (matrix.py has no requests_by_glv for
  # pool-sensitivity), and the orchestrator code is shared verbatim with 4.0
  # and must not be forked. We therefore use uniform requests=50000,
  # warmups=3 here. Within-GLV pool comparability is preserved (all four
  # pool points for a GLV share the same request count); only the absolute
  # per-GLV runtime budget differs from the old scripts.
  pool-sensitivity:
    metric: throughput
    sweep:
      pool_by_glv:
        java: [8, 32, 128, 256]
        go: [4, 32, 128, 256]
        dotnet: [8, 32, 128, 256]
        javascript: [1, 4, 16, 64]
        python: [8, 32, 128, 256]
    parallelism_by_glv:
      java: 16
      javascript: 64
      default: 256
    requests: 50000
    warmups: 3
    executions: 3
