# Benchmark matrix for THIS branch (4.0). Encodes the four test categories
# as data; matrix.py's resolve_cells() expands them into canonical cells.
# Concurrency-model realization (pool/parallelism derivation from
# concurrency, java parallelism caps, latency pool=1) is an adapter concern
# (Phase 4) and deliberately not encoded here.

tests:
  # Category 1: per-request transport cost. Sequential latency over two
  # query sizes, run for every GLV.
  protocol-overhead:
    metric: latency
    points:
      size:
        tiny: "g.V()"
        medium: "g.V().repeat(both()).times(12)"
    warmups: 2
    executions: 3
    timeout: 600000

  # Category 3: Java-only peak throughput (lazy pool growth, long steady
  # state). Other GLVs peak inside scaling-curve.
  peak-throughput:
    metric: throughput
    glvs: [java]
    parallelism: 16
    pool: 5000
    requests: 5000000
    warmups: 2
    executions: 3

  # Category 4: concurrency scaling curve. Request counts are tiered by
  # concurrency, per GLV, with a "default" fallback for everything but
  # python.
  scaling-curve:
    metric: throughput
    sweep:
      concurrency: [4, 16, 64, 128, 256, 512, 1000, 5000]
    warmups: 2
    executions: 3
    requests_by_concurrency:
      default:
        "<=4": 1000
        "<=16": 5000
        "<=64": 10000
        "<=128": 30000
        "<=1000": 50000
        ">": 500000
      python:
        "<=4": 500
        "<=16": 1000
        "<=64": 3000
        "<=1000": 5000
        ">": 10000

  # Category 5: pool sensitivity. Parallelism fixed high (per GLV), pool
  # swept across four per-GLV points.
  pool-sensitivity:
    metric: throughput
    sweep:
      pool_by_glv:
        java: [128, 512, 2000, 5000]
        go: [32, 128, 512, 5000]
        dotnet: [64, 128, 256, 1000]
        javascript: [8, 32, 128, 256]
        python: [16, 64, 128, 256]
    parallelism_by_glv:
      java: 16
      javascript: 64
      default: 256
    requests: 50000
    warmups: 5
    executions: 3
